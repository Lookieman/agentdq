# AgentDQ - Reference Table Manifest
# ---------------------------------------------------------------------------
# v1.0 | 05-Jul-2026 | Initial creation. Ten Phase-1 reference tables for
#                      MARA / MARC, with as-of metadata; all pending.
# v1.1 | 05-Jul-2026 | Switch to xlsx loaded via extract_loader. Add
#                      header_anchor + sheet per table. T006, T001W, T134 are
#                      real CAL extracts and marked loaded; remainder pending.
# ---------------------------------------------------------------------------
# Extract each table from the appliance the same way you exported the master
# data (SE16N / SE12 to xlsx), drop the file here, set header_anchor to a field
# that appears in the export's header row, then flip status to `loaded` and fill
# source_system + extract_date (a loaded list with no "as of when" is itself a
# mild DQ defect; the store's missing_asof() will flag it).
#
# Only tables whose value set is large, client-specific or externally
# standardised belong here. Small fixed domains (e.g. BESKZ = E/F/X) stay in the
# rule bank as template_fixed and must NOT be added here.
# ---------------------------------------------------------------------------

version: 1

