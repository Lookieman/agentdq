table: MARA
description: General Material Data
source_system: SAP S/4HANA (Cloud Appliance Library)
primary_key:
- MATNR
header_anchor: MATNR
file_pattern: '{table}_EX_DATA.xlsx'
uniqueness:
  scope: null
  blocking_keys:
  - MTART
  - MEINS
  compare_fields:
  - field: MAKT.MAKTX
    weight: 1.0
  # Fuzzy method: token_sort_ratio (rapidfuzz).
  # Sorts the words in each description, then measures the edit similarity.
  # Chosen because it handles word-order changes ("Steel Pump 123" vs
  # "Pump Steel 123") and has no built-in prefix bias. Jaro-Winkler was the
  # earlier default, but it flattered pairs that shared a starting word
  # (a "Pump Precision Steel 123" vs "Pump Precision Brass 456" case) and
  # missed pairs that shared an ending. Alternatives allowed at this key are:
  #   ratio            classic Levenshtein similarity, sensitive to order
  #   token_set_ratio  ignores repeated words; risks false positives when the
  #                    difference is one added qualifier
  #   jaro_winkler     the earlier default; kept for comparison runs
  methods:
    fuzzy:
      metric: token_sort_ratio
      weight: 0.5
    semantic:
      model: all-MiniLM-L6-v2
      weight: 0.5
  bands:
    duplicate: 0.92
    review_low: 0.8
  # Ceiling on ONE block. Comparison inside a block is all-pairs, so a block of
  # n records costs n(n-1)/2 comparisons and a large block is the only way this
  # stage becomes slow. A block above the ceiling is HELD BACK, not compared,
  # and its records leave the uniqueness denominator, so a block nobody looked
  # at is never counted as a clean one.
  # 20,000,000 pairs is about 20 to 25 seconds on the fuzzy rung alone and
  # roughly double that with the semantic rung. Alternatives at this key:
  #   5000000    the earlier hard-coded value; a 3,180-record block already
  #              exceeds it, and it fires on a run that takes 7 seconds
  #   50000000   about two minutes; never fires on any dataset in this repo
  # 20000000 was chosen to hold the wait on a screen under a minute and still
  # cover every block in the synthetic and real datasets here.
  max_block_pairs: 20000000
formatting:
  decimal_separator: ','
  thousands_separator: .
  date_format: '%m/%d/%Y'
  null_date_sentinels:
  - 00/00/0000
