- rule_id: INF_MARA_GEWEI_DOMAIN_IN
  name: GEWEI domain_in (inferred)
  table: MARA
  dama_dimension: Validity
  archetype: domain_in
  severity: Medium
  description: The high population density and the dominance of a single value ('KG')
    among the potential distinct values indicate that this field serves a critical
    role as a weight measurement unit. The closed set of values confirms that it is
    likely designed to accept specific units that are not arbitrary but are essential
    for maintaining consistency and correctness in usage. Therefore, enforcing that
    GEWEI must contain one of the recognized weight units is justified, rather than
    merely describing current data.
  fields:
  - GEWEI
  assertion:
    node: cmp
    field: GEWEI
    op: in
    value:
    - KG
  executable: true
  provenance:
    source: data_driven_inference
    natural_language: The high population density and the dominance of a single value
      ('KG') among the potential distinct values indicate that this field serves a
      critical role as a weight measurement unit. The closed set of values confirms
      that it is likely designed to accept specific units that are not arbitrary but
      are essential for maintaining consistency and correctness in usage. Therefore,
      enforcing that GEWEI must contain one of the recognized weight units is justified,
      rather than merely describing current data.
